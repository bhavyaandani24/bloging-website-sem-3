<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bhavya Andani</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">Bhavya Andani</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="write.html">Write</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main>
    <h2 style="margin-bottom: 15px;">Login</h2>

    <form id="login-form" class="form-box">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password">
      </div>

      <button type="submit">Login</button>

      <p class="form-footer-text">Don't have an account? <a href="register.html">Register here</a></p>
    </form>
  </main>

  <footer>

  </footer>

  <script src="script.js"></script>
</body>
</html>
