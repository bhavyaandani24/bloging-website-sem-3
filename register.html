<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Bhavya Andani</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">Bhavya Andani</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="write.html">Write</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main>
    <h2 style="margin-bottom: 15px;">Create an Account</h2>

    <form id="register-form" class="form-box">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="e.g. Bhavya Andani">
      </div>

      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Choose a password">
      </div>

      <button type="submit">Register</button>

      <p class="form-footer-text">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </main>

  <footer>
    &copy; 2026 Bhavya Andani. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
