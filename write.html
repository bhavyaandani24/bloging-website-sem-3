<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write a Post - Bhavya Andani</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">Bhavya Andani</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="write.html">Write</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main>
    <h2 style="margin-bottom: 15px;">Write a New Post</h2>

    <div id="login-notice" class="notice-box" style="display:none;">
      You need to be logged in to write a post.
      <a href="login.html">Login</a> or <a href="register.html">Register</a> first.
    </div>

    <form id="write-form" class="form-box" style="max-width: 100%;">
      <div class="form-group">
        <label>Posting as</label>
        <div id="write-author-name" style="padding: 8px 0; color:#6366f1; font-weight:bold;"></div>
      </div>

      <div class="form-group">
        <label for="title">Post Title</label>
        <input type="text" id="title" placeholder="e.g. What I Learned Building My Portfolio">
      </div>

      <div class="form-group">
        <label for="content">Your Post</label>
        <textarea id="content" placeholder="Write your post here..."></textarea>
      </div>

      <button type="submit">Publish Post</button>
    </form>
  </main>

  <footer>
    &copy; 2026 Bhavya Andani. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
